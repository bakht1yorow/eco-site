<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News & Events | Greenaissance</title>
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body data-title="nav_news">
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="page-title">
      <div class="container">
        <h1 data-i18n="news_title"></h1>
        <p data-i18n="news_intro"></p>
      </div>
    </div>

    <section>
      <div class="container grid">
        <article class="card news-item">
          <div class="news-meta"><span class="tag" data-i18n="tag_news"></span></div>
          <h3 data-i18n="n1_title"></h3><p data-i18n="n1_text"></p>
        </article>
        <article class="card news-item">
          <div class="news-meta"><span class="tag tag-event" data-i18n="tag_join"></span></div>
          <h3 data-i18n="n2_title"></h3><p data-i18n="n2_text"></p>
        </article>
        <article class="card news-item">
          <div class="news-meta"><span class="tag" data-i18n="tag_ideas"></span></div>
          <h3 data-i18n="n3_title"></h3><p data-i18n="n3_text"></p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="translations.js?v=18"></script>
  <script src="main.js?v=18"></script>
</body>
</html>
