<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Team | Eco Committee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-title="nav_team">
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="page-title">
      <div class="container">
        <h1 data-i18n="team_title"></h1>
        <p data-i18n="team_intro"></p>
      </div>
    </div>

    <section>
      <div class="container grid grid-3">
        <!-- To add a photo: replace the emoji with <img src="images/name.jpg" alt=""> -->
        <div class="card member"><div class="avatar">🌱</div><h3 data-i18n="member_name"></h3><div class="role" data-i18n="role_president"></div></div>
        <div class="card member"><div class="avatar">🌿</div><h3 data-i18n="member_name"></h3><div class="role" data-i18n="role_vice"></div></div>
        <div class="card member"><div class="avatar">🌳</div><h3 data-i18n="member_name"></h3><div class="role" data-i18n="role_projects"></div></div>
        <div class="card member"><div class="avatar">📸</div><h3 data-i18n="member_name"></h3><div class="role" data-i18n="role_media"></div></div>
        <div class="card member"><div class="avatar">♻️</div><h3 data-i18n="member_name"></h3><div class="role" data-i18n="role_member"></div></div>
        <div class="card member"><div class="avatar">📚</div><h3 data-i18n="member_name"></h3><div class="role" data-i18n="role_teacher"></div></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="translations.js"></script>
  <script src="main.js"></script>
</body>
</html>
