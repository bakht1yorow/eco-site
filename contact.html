<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Eco Committee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-title="nav_contact">
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="page-title">
      <div class="container">
        <h1 data-i18n="contact_title"></h1>
        <p data-i18n="contact_intro"></p>
      </div>
    </div>

    <section>
      <div class="container grid grid-2">
        <div class="card">
          <ul class="contact-list">
            <li><span class="ci">✉️</span><div><strong data-i18n="label_email"></strong><a id="contact-email" href="#"></a></div></li>
            <li><span class="ci">📞</span><div><strong data-i18n="label_phone"></strong><a id="contact-phone" href="#"></a></div></li>
            <li><span class="ci">📍</span><div><strong data-i18n="label_address"></strong><span data-i18n="value_address"></span></div></li>
          </ul>
        </div>

        <div class="card">
          <form id="contact-form">
            <label for="f-name" data-i18n="form_name"></label>
            <input id="f-name" name="name" type="text" required>
            <label for="f-email" data-i18n="form_email"></label>
            <input id="f-email" name="email" type="email" required>
            <label for="f-msg" data-i18n="form_message"></label>
            <textarea id="f-msg" name="message" required></textarea>
            <p style="margin-top:16px"><button class="btn btn-green" type="submit" data-i18n="form_send"></button></p>
            <p class="form-note" data-i18n="form_note"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="translations.js"></script>
  <script src="main.js"></script>
</body>
</html>
