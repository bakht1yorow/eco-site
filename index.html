<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greenaissance | Eco Committee</title>
  <meta name="description" content="School Eco Committee: recycling, school garden, saving energy and clean-up days.">
  <link rel="stylesheet" href="style.css?v=28">
</head>
<body data-title="nav_home">
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero">
      <div class="container">
        <span class="badge-school" data-i18n="school_name"></span>
        <h1 data-i18n="hero_title"></h1>
        <p data-i18n="hero_text"></p>
        <div class="hero-buttons">
          <a class="btn btn-primary" href="team" data-i18n="nav_team"></a>
          <a class="btn btn-outline" href="contact" data-i18n="btn_join"></a>
        </div>
      </div>
    </section>

    <section>
      <div class="container">
        <h2 class="section-title" data-i18n="what_title"></h2>
        <div class="grid grid-3">
          <div class="card"><div class="icon">♻️</div><h3 data-i18n="card1_title"></h3><p data-i18n="card1_text"></p></div>
          <div class="card"><div class="icon">💡</div><h3 data-i18n="card2_title"></h3><p data-i18n="card2_text"></p></div>
          <div class="card"><div class="icon">🌳</div><h3 data-i18n="card3_title"></h3><p data-i18n="card3_text"></p></div>
        </div>
      </div>
    </section>

    <section style="padding-top:0">
      <div class="container">
        <div class="cta">
          <h2 data-i18n="cta_title"></h2>
          <p data-i18n="cta_text"></p>
          <a class="btn btn-green" href="contact" data-i18n="btn_join"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="translations.js?v=28"></script>
  <script src="main.js?v=28"></script>
</body>
</html>
